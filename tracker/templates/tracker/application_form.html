
{% extends "tracker/base.html" %}

{% block title %}{{ title }} - JobTracker{% endblock %}

{% block content %}

<div class="card" style="max-width: 750px; margin: auto;">

    <h2>{{ title }}</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn" type="submit">
            Save Application
        </button>

        <a class="btn btn-secondary"
           href="{% url 'tracker:dashboard' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
